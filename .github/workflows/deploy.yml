name: Deploy site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: site/package-lock.json
      - run: npm ci
        working-directory: site
      - run: npm run build
        working-directory: site
      - name: Bundle data with the site
        run: |
          mkdir -p site/dist/data/cache
          cp data/latest.json site/dist/data/ 2>/dev/null || echo '{"error":"no data yet"}' > site/dist/data/latest.json
          cp data/health.json site/dist/data/ 2>/dev/null || true
          cp data/cache/zones.geojson site/dist/data/cache/ 2>/dev/null || true
          cp site/dist/index.html site/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
