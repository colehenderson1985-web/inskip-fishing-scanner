name: Daily refresh

on:
  schedule:
    - cron: "30 18 * * *"      # 04:30 AEST (Australia/Brisbane, UTC+10, no DST) — morning brief
    - cron: "0 7 * * *"        # 17:00 AEST — evening preview of tomorrow (pushed only if it looks good)
  workflow_dispatch:
    inputs:
      reason:
        description: "Why (optional)"
        required: false
        default: "manual"
  repository_dispatch:
    types: [refresh]

concurrency:
  group: refresh
  cancel-in-progress: false

permissions:
  contents: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - name: Install
        run: pip install -r pipeline/requirements.txt

      - name: Run refresh
        id: refresh
        working-directory: pipeline
        run: |
          python -m scanner.run refresh --days 7 | tee refresh.out
          python - >> "$GITHUB_OUTPUT" <<'EOF'
          import json, os
          try:
              h = json.load(open('../data/health.json'))
              print("overall=" + h.get("overall", "unknown"))
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as s:
                  s.write(f"## Refresh: {h.get('overall')}\n\n| source | ok | items | error |\n|---|---|---|---|\n")
                  for k, v in h["sources"].items():
                      s.write(f"| {k} | {'✅' if v['ok'] else '❌'} | {v.get('items')} | {(v.get('error') or v.get('note') or '')[:160]} |\n")
                  for e in h.get("errors", []):
                      s.write(f"\n- ⚠ {e}")
          except Exception as e:
              print("overall=failed")
          EOF

      - name: Push notification (ntfy)
        if: github.event_name == 'schedule' || github.event.inputs.reason == 'notify'
        working-directory: pipeline
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -m scanner.notify || true

      - name: Tests (post-run sanity)
        working-directory: pipeline
        run: python -m pytest -q tests/test_model.py

      - name: Commit data
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data/latest.json data/health.json data/derived data/raw data/cache data/observations
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: refresh $(date -u +'%Y-%m-%dT%H:%MZ') (${{ steps.refresh.outputs.overall }})"
            git pull --rebase -X theirs origin main || true
            git push
          fi

      - name: Open issue if degraded
        if: steps.refresh.outputs.overall != 'ok'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const h = JSON.parse(fs.readFileSync('data/health.json','utf8'));
            const bad = Object.entries(h.sources).filter(([k,v]) => !v.ok).map(([k,v]) => `- **${k}**: ${v.error || 'no data'}`).join('\n');
            const title = `Pipeline degraded: ${h.stale_categories.join(', ') || 'see details'}`;
            const {data: issues} = await github.rest.issues.listForRepo({owner: context.repo.owner, repo: context.repo.repo, state: 'open', labels: 'pipeline'});
            const body = `Refresh at ${h.generated_at} finished **${h.overall}**.\n\nFailed sources:\n${bad}\n\nLast good data is retained and shown as stale on the dashboard.`;
            if (issues.length) {
              await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: issues[0].number, body});
            } else {
              await github.rest.issues.create({owner: context.repo.owner, repo: context.repo.repo, title, body, labels: ['pipeline']});
            }
