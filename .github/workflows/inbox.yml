name: Report inbox

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write

jobs:
  ingest:
    if: contains(github.event.issue.labels.*.name, 'report')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r pipeline/requirements.txt
      - name: Extract payload from issue body
        id: payload
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body || "";
            const m = body.match(/```json\s*([\s\S]*?)```/);
            if (!m) { core.setFailed("No ```json block in issue body"); return; }
            const payload = JSON.parse(m[1]);
            payload.submitted_by = context.payload.issue.user.login;
            payload.issue = context.payload.issue.number;
            require('fs').writeFileSync('payload.json', JSON.stringify(payload));
      - name: Ingest
        working-directory: pipeline
        run: python -m scanner.run inbox ../payload.json | tee ingest.out
      - name: Re-score with the new observation
        working-directory: pipeline
        run: python -m scanner.run refresh --days 7 || true
      - name: Commit
        run: |
          git config user.name "scanner-bot"
          git config user.email "scanner-bot@users.noreply.github.com"
          git add data
          git diff --cached --quiet || (git commit -m "inbox: issue #${{ github.event.issue.number }}" && git pull --rebase origin main && git push)
      - name: Reply and close
        uses: actions/github-script@v7
        with:
          script: |
            const out = require('fs').readFileSync('pipeline/ingest.out','utf8');
            let msg = "Filed. ";
            try { const j = JSON.parse(out); const o = j.observation; msg += `Species: ${o.species.join(', ') || 'none detected'}. Places: ${o.locations.join(', ') || 'none detected'}. Catch date: ${o.catch_date || 'not stated'}.`; } catch {}
            await github.rest.issues.createComment({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, body: msg + " The dashboard updates on the next deploy (a few minutes)."});
            await github.rest.issues.update({owner: context.repo.owner, repo: context.repo.repo, issue_number: context.payload.issue.number, state: 'closed'});
