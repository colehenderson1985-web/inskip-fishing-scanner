# Species — local seasonality, preferences and legal limits (Queensland tidal waters).
# season.peak/shoulder are month numbers. Preferences are heuristics used by the
# scoring model; they are hypotheses to be calibrated with logged results.
# legal values verified against qld.gov.au limits-tidal (updated 25 Sep 2026)
# and DPI closed seasons (updated 25 Sep 2026). Always link users to the source.

legal_source: https://www.qld.gov.au/recreation/activities/boating-fishing/rec-fishing/rules/limits-tidal
closures_source: https://www.dpi.qld.gov.au/business-priorities/fisheries/closures/tidal/seasons

species:
  - id: tailor
    name: Tailor
    short: Tailor
    envs: [surf_beach, headland]
    season: {peak: [5, 6, 7, 8, 9], shoulder: [4, 10, 11]}
    tide_pref: [rising_late, high_turn, falling_early]
    light_pref: [dawn, dusk, night]
    wind: {max_onshore_kn: 20, offshore_bonus: true}
    swell: {min_m: 0.5, ideal: [0.8, 1.8], max_m: 2.5}
    clarity: moderate
    legal: {min_cm: 35, possession: 20, closures: []}
    closure_note: "K'gari eastern beach closure (Indian Head–Waddy Point, 1 Aug–29 Sep) does not apply to mainland sites."
    techniques:
      - "Ganged pilchards (4/0–5/0) on a running sinker in gutters at dawn/dusk"
      - "Metal slugs 20–40 g cast past the break, fast retrieve"
      - "Surface lures over shallow gutters on the rising tide"

