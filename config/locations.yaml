    zone_name: Conservation Park (yellow)
    line_limit: {lines: 2, hooks: 2}
    access: {vehicle: 4wd, permit: none, tide_window: "any; some tracks soft at high tide"}
    hazards: [sinkholes, barge_traffic, strong_current]
    species: [whiting, bream, flathead, trevally, grunter, mangrove_jack]
