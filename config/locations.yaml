# Fishing locations — Inskip Point / Rainbow Beach / Tin Can Bay / Cooloola
#
# Coordinates are APPROXIMATE centre points near publicly known access
# (ramps, track exits, headlands). They do not identify verified fishing spots.
# aspect_deg = compass direction the shore FACES (water side). Wind blowing
# FROM aspect_deg is dead onshore; from aspect_deg+180 is dead offshore.
# shelter_from = wind directions the location is substantially protected from.
# zone ids reference Great Sandy Marine Park Zoning Plan 2024.

region:
  id: inskip_rainbow
  name: Inskip Point & Rainbow Beach
  timezone: Australia/Brisbane
  bbox: [[-26.10, 152.95], [-25.78, 153.25]]
  marine_points:            # Open-Meteo marine sample points (must be sea cells)
    ocean: {lat: -25.90, lon: 153.22, name: "Offshore Rainbow Beach"}
    bar:   {lat: -25.78, lon: 153.12, name: "Wide Bay Bar approaches"}
  obs_station: {id: "94584", name: "Double Island Point AWS", bom_product: "IDQ60801"}
  bom_coastal_zones:
    - {id: "QLD_MW009", name: "K'gari Coast (Sandy Cape to Double Island Point)"}
    - {id: "QLD_MW010", name: "Sunshine Coast Waters (Double Island Point to Cape Moreton)"}

locations:
  - id: rainbow_town
    name: Rainbow Beach — town beach
    short: Rainbow (town)
    type: surf_beach
    centre: [-25.905, 153.097]
    approx: true
    access_point: "Rainbow Beach main beach access, foot of Clarkson Dr"
    aspect_deg: 75
    shelter_from: [W, SW, NW]
    shelter_degree: 0.8
    tide_ref: noosa_head
    marine_point: ocean
    zone: GUZ13
    zone_name: General Use
    line_limit: {lines: 3, hooks: 6}
    access: {vehicle: walk, permit: none, tide_window: "any; beach narrows near high tide"}
    hazards: [surf, rips]
    species: [tailor, dart, whiting, bream, flathead, mulloway, trevally]
    notes: "Patrolled beach in season; fish away from flagged area. Gutters shift — read the beach at low tide."

  - id: rainbow_north
    name: Rainbow Beach — north toward Inskip
    short: Rainbow (north)
    type: surf_beach
    centre: [-25.870, 153.085]
    approx: true
    access_point: "Beach access tracks between town and Inskip Peninsula"
    aspect_deg: 70
    shelter_from: [W, SW, NW]
    shelter_degree: 0.8
    tide_ref: noosa_head
    marine_point: ocean
    zone: GUZ13
    zone_name: General Use (verify HPZ26 nearshore strip)
    line_limit: {lines: 3, hooks: 6}
    access: {vehicle: 4wd, permit: none, tide_window: "avoid 2 h either side of high tide"}
    hazards: [soft_sand, high_tide_cutoff, surf]
    species: [tailor, dart, whiting, bream, flathead, mulloway, trevally]
    notes: "Long open beach, fewer people. Drive on the hard sand near low tide."

  - id: inskip_ocean
    name: Inskip Point — ocean beach
    short: Inskip (ocean)
    type: surf_beach
    centre: [-25.815, 153.065]
    approx: true
    access_point: "Inskip Peninsula Rd beach entries (ocean side)"
    aspect_deg: 60
    shelter_from: [W, SW, NW, S]
    shelter_degree: 0.7
    tide_ref: noosa_head
    tide_note: "Estimated — Inskip has no official secondary port; ocean side treated as Noosa Head."
    marine_point: bar
    zone: GUZ13
    zone_name: General Use (verify HPZ25 nearshore strip)
    line_limit: {lines: 3, hooks: 6}
    access: {vehicle: 4wd, permit: none, tide_window: "avoid 2 h either side of high tide"}
